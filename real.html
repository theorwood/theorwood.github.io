<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo's Picks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080c14;
            --surface: #0f1825;
            --surface2: #162033;
            --border: rgba(255,255,255,0.07);
            --border-bright: rgba(255,255,255,0.15);
            --text: #e8f0fe;
            --muted: #5a7090;
            --accent: #2563eb;
            --accent2: #3b82f6;
            --green: #10b981;
            --gold: #f59e0b;
            --red: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Barlow', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        h1, h2, h3, .label, .stat-num {
            font-family: 'Barlow Condensed', sans-serif;
        }
        .glass {
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .glass2 {
            background: var(--surface2);
            border: 1px solid var(--border);
        }
        /* NAV */
        .nav-btn.active {
            color: white;
            border-bottom: 2px solid var(--accent2);
        }
        /* GAME CARD */
        .pick-btn {
            transition: all 0.15s ease;
            border: 2px solid transparent;
        }
        .pick-btn:hover { border-color: var(--border-bright); background: var(--surface2); }
        .pick-btn.selected-home { border-color: #10b981 !important; background: rgba(16,185,129,0.12) !important; }
        .pick-btn.selected-away { border-color: #3b82f6 !important; background: rgba(59,130,246,0.12) !important; }
        /* VOTE BAR */
        .vote-bar-track { height: 6px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
        .vote-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
        /* STREAK BADGE */
        .streak-badge {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800;
            letter-spacing: 0.03em;
        }
        /* WAGER PANEL */
        .wager-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
        }
        .wager-panel.open { max-height: 200px; }
        /* PULSE */
        .live-dot {
            width: 7px; height: 7px;
            background: #ef4444;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }
            70% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
            100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
        }
        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }
        /* MODALS */
        .modal-bg { background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); }
        /* LOADING */
        .spin { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* POINTS BADGE */
        .points-pill {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.05em;
            padding: 2px 7px;
            border-radius: 999px;
        }
        /* TEAM COLORS */
        .tc-hawks{color:#E31837} .tc-celtics{color:#007A33} .tc-nets{color:#AAAAAA}
        .tc-hornets{color:#00788C} .tc-bulls{color:#CE1141} .tc-cavaliers{color:#FDBB30}
        .tc-mavericks{color:#00538C} .tc-nuggets{color:#FEC524} .tc-pistons{color:#C8102E}
        .tc-warriors{color:#FFC72C} .tc-rockets{color:#CE1141} .tc-pacers{color:#FDBB30}
        .tc-clippers{color:#C8102E} .tc-lakers{color:#FDB927} .tc-grizzlies{color:#5D76A9}
        .tc-heat{color:#F9A01B} .tc-bucks{color:#00471B} .tc-timberwolves{color:#78BE20}
        .tc-pelicans{color:#C8102E} .tc-knicks{color:#F58426} .tc-thunder{color:#007AC1}
        .tc-magic{color:#0077C0} .tc-76ers{color:#ED174C} .tc-suns{color:#E56020}
        .tc-blazers{color:#E03A3E} .tc-kings{color:#5A2D81} .tc-spurs{color:#C4CED4}
        .tc-raptors{color:#CE1141} .tc-jazz{color:#F9A01B} .tc-wizards{color:#E31837}
        /* BG variants */
        .bg-hawks{background:#E31837} .bg-celtics{background:#007A33} .bg-nets{background:#888}
        .bg-cavaliers{background:#860038} .bg-pistons{background:#C8102E} .bg-thunder{background:#007AC1}
        .bg-warriors{background:#FFC72C} .bg-lakers{background:#552583} .bg-heat{background:#98002E}
        .bg-knicks{background:#006BB6} .bg-timberwolves{background:#0C2340} .bg-spurs{background:#555}

        /* CHART */
        #points-chart-wrapper { height: 140px; width: 100%; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

        .info-btn {
            position: absolute; top: 10px; right: 10px;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: rgba(59,130,246,0.2);
            border: 1px solid rgba(59,130,246,0.4);
            font-size: 11px; font-weight: 800;
            color: #93c5fd;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            transition: background 0.15s;
            z-index: 10;
        }
        .info-btn:hover { background: rgba(59,130,246,0.4); }
    </style>
</head>
<body class="pb-16">

<!-- HEADER -->
<header class="sticky top-0 z-50 border-b" style="background:rgba(8,12,20,0.97);border-color:var(--border);backdrop-filter:blur(12px)">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="rounded-lg p-1.5" style="background:var(--accent)">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            </div>
            <div>
                <div class="text-white font-black text-lg tracking-tight" style="font-family:'Barlow Condensed',sans-serif;letter-spacing:-0.01em">THEO'S <span style="color:var(--accent2)">PICKS</span></div>
                <div class="text-xs font-medium" style="color:var(--muted);font-size:9px;letter-spacing:0.08em;text-transform:uppercase" id="header-date">NBA Playoffs 2025</div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <!-- Points -->
            <div class="flex items-center gap-2 rounded-full px-3 py-1.5 cursor-pointer" style="background:var(--surface);border:1px solid var(--border-bright)" onclick="showProfileModal()">
                <div class="rounded-full p-1" style="background:rgba(245,158,11,0.15)">
                    <svg class="w-3.5 h-3.5" style="color:var(--gold)" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a5 5 0 100 10A5 5 0 0012 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>
                </div>
                <div>
                    <div class="text-white font-semibold text-xs leading-none" id="user-name-display">Guest</div>
                    <div class="text-xs leading-none mt-0.5" style="color:var(--muted);font-size:9px">tap to sign in</div>
                </div>
            </div>
            <div class="flex items-center gap-1.5 rounded-full px-3 py-1.5" style="background:var(--surface);border:1px solid var(--border-bright)">
                <svg class="w-3.5 h-3.5" style="color:var(--gold)" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2l2.39 4.84L18 7.63l-4 3.9.94 5.47L10 14.27l-4.94 2.73L6 11.53 2 7.63l5.61-.79L10 2z"/></svg>
                <span class="font-black text-white text-sm" style="font-family:'Barlow Condensed',sans-serif" id="user-points-display">0</span>
                <span class="text-xs font-semibold" style="color:var(--muted);font-size:9px;text-transform:uppercase">pts</span>
            </div>
            <div id="delete-profile-btn" class="hidden rounded-full p-1.5 cursor-pointer transition-all" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2)" onclick="showDeleteModal()">
                <svg class="w-3.5 h-3.5" style="color:var(--red)" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </div>
        </div>
    </div>
    <!-- Streak indicator -->
    <div id="streak-banner" class="hidden max-w-5xl mx-auto px-4 pb-2">
        <div class="rounded-lg px-3 py-1.5 flex items-center gap-2 text-xs font-bold" style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.25)">
            <span style="color:var(--gold)">🔥</span>
            <span id="streak-banner-text" style="color:var(--gold);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800"></span>
        </div>
    </div>
</header>

<!-- MODALS -->
<div id="custom-modal" class="hidden fixed inset-0 z-[100] modal-bg flex items-center justify-center p-4">
    <div class="w-full max-w-sm rounded-2xl p-6 relative" style="background:var(--surface);border:1px solid var(--border-bright);max-height:90vh;overflow-y:auto">
        <button id="modal-close-icon" onclick="closeModal()" class="hidden absolute top-4 right-4 rounded-full p-1.5 transition-colors" style="background:var(--surface2);color:var(--muted)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <div id="modal-content"></div>
        <div class="flex gap-3 mt-5" id="modal-actions">
            <button onclick="closeModal()" class="flex-1 py-3 rounded-xl font-bold text-xs uppercase tracking-widest" style="background:var(--surface2);color:var(--muted)">Cancel</button>
            <button id="modal-confirm-btn" class="flex-1 py-3 rounded-xl font-bold text-xs uppercase tracking-widest text-white" style="background:var(--accent)">Confirm</button>
        </div>
    </div>
</div>

<!-- SYNC OVERLAY -->
<div id="sync-overlay" class="hidden fixed inset-0 z-[110] modal-bg flex items-center justify-center">
    <div class="text-center space-y-3">
        <div class="spin w-10 h-10 rounded-full border-2 mx-auto" style="border-color:var(--accent);border-top-color:transparent"></div>
        <div class="font-bold text-white text-sm" style="font-family:'Barlow Condensed',sans-serif" id="sync-message">Syncing...</div>
    </div>
</div>

<!-- VOTERS MODAL -->
<div id="voters-modal" class="hidden fixed inset-0 z-[100] modal-bg flex items-center justify-center p-4">
    <div class="w-full max-w-xs rounded-2xl p-5 relative" style="background:var(--surface);border:1px solid var(--border-bright)">
        <button onclick="closeVotersModal()" class="absolute top-4 right-4 rounded-full p-1.5" style="background:var(--surface2);color:var(--muted)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <div id="voters-modal-content"></div>
    </div>
</div>

<!-- MAIN -->
<main class="max-w-5xl mx-auto px-4 pt-5 space-y-6">
    <nav class="flex gap-6 border-b pb-0" style="border-color:var(--border)">
        <button onclick="switchTab('schedule')" id="tab-schedule" class="nav-btn active pb-3 font-semibold text-sm transition-all" style="color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:0.04em;text-transform:uppercase">Schedule</button>
        <button onclick="switchTab('picks')" id="tab-picks" class="nav-btn pb-3 font-semibold text-sm transition-all" style="color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:0.04em;text-transform:uppercase">My Picks</button>
        <button onclick="switchTab('leaderboard')" id="tab-leaderboard" class="nav-btn pb-3 font-semibold text-sm transition-all" style="color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:0.04em;text-transform:uppercase">Leaderboard</button>
        <button onclick="switchTab('results')" id="tab-results" class="nav-btn pb-3 font-semibold text-sm transition-all" style="color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:0.04em;text-transform:uppercase">Results</button>
    </nav>

    <!-- SCHEDULE TAB -->
    <section id="section-schedule" class="tab-content active space-y-6">
        <div id="today-section" class="hidden space-y-3">
            <div class="flex items-center gap-2">
                <span class="live-dot"></span>
                <span class="font-black text-white" style="font-family:'Barlow Condensed',sans-serif;font-size:18px;letter-spacing:0.02em" id="today-title">TODAY'S GAMES</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="today-cards"></div>
        </div>
        <div id="upcoming-section" class="space-y-6">
            <div id="upcoming-cards"></div>
        </div>
    </section>

    <!-- MY PICKS TAB -->
    <section id="section-picks" class="tab-content space-y-6">
        <!-- Points chart -->
        <div class="rounded-2xl p-4" style="background:var(--surface);border:1px solid var(--border)">
            <div class="flex justify-between items-center mb-3">
                <div class="font-black text-white text-base" style="font-family:'Barlow Condensed',sans-serif;letter-spacing:0.03em">POINTS HISTORY</div>
                <div class="flex items-center gap-1.5 rounded-full px-3 py-1" style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.25)">
                    <svg class="w-3 h-3" style="color:var(--gold)" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2l2.39 4.84L18 7.63l-4 3.9.94 5.47L10 14.27l-4.94 2.73L6 11.53 2 7.63l5.61-.79L10 2z"/></svg>
                    <span class="font-black text-sm" id="chart-pts-label" style="font-family:'Barlow Condensed',sans-serif;color:var(--gold)">0</span>
                    <span class="text-xs font-semibold" style="color:var(--muted);font-size:9px;text-transform:uppercase">total pts</span>
                </div>
            </div>
            <div id="points-chart-wrapper"></div>
        </div>

        <!-- Streak info -->
        <div class="rounded-xl p-4 flex items-center justify-between" style="background:var(--surface);border:1px solid var(--border)">
            <div>
                <div class="text-xs font-semibold uppercase tracking-wider mb-1" style="color:var(--muted)">Current Streak</div>
                <div class="font-black text-2xl text-white" style="font-family:'Barlow Condensed',sans-serif" id="streak-display">0</div>
            </div>
            <div>
                <div class="text-xs font-semibold uppercase tracking-wider mb-1 text-right" style="color:var(--muted)">Next Pick Worth</div>
                <div class="font-black text-2xl text-right" style="font-family:'Barlow Condensed',sans-serif;color:var(--gold)" id="next-pts-display">1 pt</div>
            </div>
            <div>
                <div class="text-xs font-semibold uppercase tracking-wider mb-1 text-right" style="color:var(--muted)">Correct / Total</div>
                <div class="font-black text-2xl text-right text-white" style="font-family:'Barlow Condensed',sans-serif" id="record-display">0 / 0</div>
            </div>
        </div>

        <!-- Active picks -->
        <div>
            <div class="font-black text-white mb-3" style="font-family:'Barlow Condensed',sans-serif;font-size:17px;letter-spacing:0.03em">ACTIVE PICKS</div>
            <div id="active-picks-list" class="space-y-3"></div>
        </div>

        <!-- Pick history -->
        <div class="pt-4" style="border-top:1px solid var(--border)">
            <div class="font-black text-white mb-3" style="font-family:'Barlow Condensed',sans-serif;font-size:17px;letter-spacing:0.03em">PICK HISTORY</div>
            <div id="pick-history-list" class="space-y-2"></div>
        </div>
    </section>

    <!-- LEADERBOARD TAB -->
    <section id="section-leaderboard" class="tab-content space-y-4">
        <div class="flex justify-between items-center">
            <div class="font-black text-white" style="font-family:'Barlow Condensed',sans-serif;font-size:18px;letter-spacing:0.02em">LEADERBOARD</div>
            <button onclick="fetchLeaderboard()" class="text-xs font-bold uppercase tracking-wider" style="color:var(--accent2)">Refresh</button>
        </div>
        <div class="rounded-2xl overflow-hidden" style="background:var(--surface);border:1px solid var(--border)">
            <div class="grid grid-cols-12 px-4 py-3" style="background:var(--surface2);border-bottom:1px solid var(--border)">
                <div class="col-span-1 text-xs font-black uppercase tracking-wider" style="color:var(--muted)">#</div>
                <div class="col-span-7 text-xs font-black uppercase tracking-wider" style="color:var(--muted)">Player</div>
                <div class="col-span-2 text-xs font-black uppercase tracking-wider text-center" style="color:var(--muted)">W/L</div>
                <div class="col-span-2 text-xs font-black uppercase tracking-wider text-right" style="color:var(--muted)">Pts</div>
            </div>
            <div id="leaderboard-list"></div>
        </div>
    </section>

    <!-- RESULTS TAB -->
    <section id="section-results" class="tab-content space-y-4">
        <div class="font-black text-white" style="font-family:'Barlow Condensed',sans-serif;font-size:18px;letter-spacing:0.02em">RECENT RESULTS</div>
        <div id="results-list" class="space-y-6"></div>
    </section>
</main>

<script>
// ─── FIREBASE CONFIG ───────────────────────────────────────────────
const FIREBASE_DB_URL = "https://real-16bde-default-rtdb.firebaseio.com/";

// ─── GLOBAL STATE ──────────────────────────────────────────────────
let userName = localStorage.getItem('theo_user_name') || 'Guest';
let userPoints = 0;
let currentStreak = 0;   // consecutive correct picks
let totalCorrect = 0;
let totalPicks = 0;
let pointsHistory = [];  // [{time, val}]
let activePicks = [];    // [{gameId, team, wager, wageredPoints, espnOdds, placedAt}]
let pickHistory = [];    // [{gameId, team, result:'win'|'loss', pointsEarned, wager, wageredPoints, espnOdds, settledAt}]
let liveScheduleData = [];
let leaderboardData = [];
let gameVotes = {};      // gameId -> {home:[names], away:[names]}  (loaded from firebase)

// ─── STREAK → POINTS CALCULATION ───────────────────────────────────
// 1st correct = 1pt, 2nd = 2, 3rd = 3, 4th = 4, 5th+ = 5
function streakToPoints(streak) {
    if (streak <= 0) return 1;
    if (streak === 1) return 2;
    if (streak === 2) return 3;
    if (streak === 3) return 4;
    return 5;
}

// Next pick value = what you'd earn at current streak + 1
function nextPickValue() {
    return streakToPoints(currentStreak);
}

// ─── ESPN ODDS → point multiplier for wagers ───────────────────────
// ML odds from ESPN: convert to decimal multiplier for wager return
function mlToMultiplier(ml) {
    if (!ml || ml === 0) return 2.0;
    if (ml > 0) return 1 + (ml / 100);
    return 1 + (100 / Math.abs(ml));
}

function mlToImpliedProb(ml) {
    if (!ml) return 0.5;
    if (ml > 0) return 100 / (ml + 100);
    return Math.abs(ml) / (Math.abs(ml) + 100);
}

// ─── TEAM CLASS HELPER ──────────────────────────────────────────────
function teamClass(name) {
    if (!name) return '';
    return name.trim().split(' ').pop().toLowerCase();
}

// ─── DATE HELPERS ───────────────────────────────────────────────────
function formatGameDate(d) {
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}`;
}
function formatYMD(d) {
    return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}
function formatShortDate(d) {
    return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

// ─── FIREBASE HELPERS ───────────────────────────────────────────────
async function dbGet(path) {
    const r = await fetch(`${FIREBASE_DB_URL}${path}.json`);
    return await r.json();
}
async function dbPut(path, data) {
    await fetch(`${FIREBASE_DB_URL}${path}.json`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
    });
}
async function dbPatch(path, data) {
    await fetch(`${FIREBASE_DB_URL}${path}.json`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
    });
}
async function dbDelete(path) {
    await fetch(`${FIREBASE_DB_URL}${path}.json`, {method:'DELETE'});
}

// ─── SAVE/LOAD PROFILE ─────────────────────────────────────────────
async function saveProfile() {
    if (userName === 'Guest' || !FIREBASE_DB_URL) return;
    const payload = {
        name: userName,
        points: userPoints,
        currentStreak,
        totalCorrect,
        totalPicks,
        pointsHistory: JSON.stringify(pointsHistory),
        activePicks: JSON.stringify(activePicks),
        pickHistory: JSON.stringify(pickHistory)
    };
    await dbPut(`/users/${encodeURIComponent(userName)}`, payload);
}

async function loadProfile(name) {
    if (name === 'Guest' || !FIREBASE_DB_URL) {
        resetUserState();
        return;
    }
    try {
        const profile = await dbGet(`/users/${encodeURIComponent(name)}`);
        if (profile && profile.name) {
            userPoints = parseFloat(profile.points) || 0;
            currentStreak = parseInt(profile.currentStreak) || 0;
            totalCorrect = parseInt(profile.totalCorrect) || 0;
            totalPicks = parseInt(profile.totalPicks) || 0;
            try { pointsHistory = JSON.parse(profile.pointsHistory) || []; } catch(e) { pointsHistory = []; }
            try { activePicks = JSON.parse(profile.activePicks) || []; } catch(e) { activePicks = []; }
            try { pickHistory = JSON.parse(profile.pickHistory) || []; } catch(e) { pickHistory = []; }
        } else {
            // New user - start fresh and save
            resetUserState();
            await saveProfile();
        }
    } catch(e) {
        console.error('Profile load error:', e);
        resetUserState();
    }
}

function resetUserState() {
    userPoints = 0;
    currentStreak = 0;
    totalCorrect = 0;
    totalPicks = 0;
    pointsHistory = [{ time: Date.now(), val: 0 }];
    activePicks = [];
    pickHistory = [];
}

// ─── VOTES: read from firebase ─────────────────────────────────────
async function loadVotesForGame(gameId) {
    try {
        const data = await dbGet(`/votes/${gameId}`);
        gameVotes[gameId] = data || { home: {}, away: {} };
    } catch(e) {
        gameVotes[gameId] = { home: {}, away: {} };
    }
}

async function castVote(gameId, side /* 'home' | 'away' */, team) {
    if (userName === 'Guest') { showProfileModal(); return; }
    
    // Load current votes for this game
    await loadVotesForGame(gameId);
    const votes = gameVotes[gameId] || { home: {}, away: {} };

    // Remove from both sides first (user might be changing vote)
    delete votes.home[encodeKey(userName)];
    delete votes.away[encodeKey(userName)];

    // Add to chosen side
    votes[side][encodeKey(userName)] = userName;
    gameVotes[gameId] = votes;

    // Save to firebase
    await dbPut(`/votes/${gameId}`, votes);
}

function encodeKey(name) {
    // Firebase keys can't have . / [ ] #
    return name.replace(/[./#\[\]]/g, '_');
}

function getVoteCounts(gameId) {
    const v = gameVotes[gameId] || {};
    const homeVoters = Object.values(v.home || {});
    const awayVoters = Object.values(v.away || {});
    return { homeVoters, awayVoters, homeCount: homeVoters.length, awayCount: awayVoters.length };
}

function getUserVoteSide(gameId) {
    const v = gameVotes[gameId] || {};
    const key = encodeKey(userName);
    if ((v.home || {})[key]) return 'home';
    if ((v.away || {})[key]) return 'away';
    return null;
}

// ─── CHECK IF USER ALREADY HAS AN ACTIVE PICK FOR GAME ─────────────
function getUserPickForGame(gameId) {
    return activePicks.find(p => p.gameId === gameId) || null;
}

// ─── PLACE A PICK ──────────────────────────────────────────────────
async function placePick(gameId, side, team, wagerPoints, espnML) {
    if (userName === 'Guest') { showProfileModal(); return; }

    // Remove existing pick for this game
    activePicks = activePicks.filter(p => p.gameId !== gameId);

    const pick = {
        gameId,
        side,       // 'home' or 'away'
        team,
        wagerPoints: wagerPoints || 0,
        espnML: espnML || null,
        placedAt: Date.now()
    };
    activePicks.push(pick);

    // Cast vote
    await castVote(gameId, side, team);
    await saveProfile();

    renderSchedule();
    renderPicks();
    updatePointsUI();
}

// ─── CANCEL A PICK ─────────────────────────────────────────────────
async function cancelPick(gameId) {
    activePicks = activePicks.filter(p => p.gameId !== gameId);
    // Remove vote
    if (userName !== 'Guest') {
        await loadVotesForGame(gameId);
        const votes = gameVotes[gameId] || { home: {}, away: {} };
        const key = encodeKey(userName);
        delete votes.home[key];
        delete votes.away[key];
        gameVotes[gameId] = votes;
        await dbPut(`/votes/${gameId}`, votes);
    }
    await saveProfile();
    renderSchedule();
    renderPicks();
}

// ─── SETTLE PICKS (admin/manual for now - button in results) ───────
// In production you'd do this server-side. Here users can manually mark results.
// We expose it so testing works.
async function settlePick(gameId, winningTeam) {
    const pickIdx = activePicks.findIndex(p => p.gameId === gameId);
    if (pickIdx === -1) return;
    const pick = activePicks[pickIdx];

    const won = pick.team === winningTeam;
    let pointsEarned = 0;

    if (won) {
        const basePoints = nextPickValue(); // Based on current streak BEFORE this pick
        if (pick.wagerPoints > 0) {
            // Wager return: base points + wager * multiplier (based on ESPN odds)
            const mult = mlToMultiplier(pick.espnML);
            const wagerReturn = Math.round(pick.wagerPoints * mult);
            pointsEarned = basePoints + wagerReturn;
        } else {
            pointsEarned = basePoints;
        }
        currentStreak++;
        totalCorrect++;
        userPoints += pointsEarned;
    } else {
        // Lose wager if one was placed
        if (pick.wagerPoints > 0) {
            userPoints = Math.max(0, userPoints - pick.wagerPoints);
        }
        currentStreak = 0;
        pointsEarned = pick.wagerPoints > 0 ? -pick.wagerPoints : 0;
    }

    totalPicks++;
    pointsHistory.push({ time: Date.now(), val: userPoints });
    if (pointsHistory.length > 30) pointsHistory.shift();

    const histEntry = {
        gameId,
        team: pick.team,
        side: pick.side,
        result: won ? 'win' : 'loss',
        pointsEarned,
        wagerPoints: pick.wagerPoints,
        espnML: pick.espnML,
        settledAt: Date.now()
    };
    pickHistory.unshift(histEntry);

    // Remove from active
    activePicks.splice(pickIdx, 1);

    await saveProfile();
    updatePointsUI();
    renderSchedule();
    renderPicks();
}

// ─── ESPN DATA FETCH ───────────────────────────────────────────────
async function fetchGameData() {
    try {
        const baseResp = await fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard");
        const baseData = await baseResp.json();
        let realDate = new Date();
        if (baseData.day && baseData.day.date) realDate = new Date(baseData.day.date);

        const nextWeek = new Date(realDate);
        nextWeek.setDate(realDate.getDate() + 14);
        const apiUrl = `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${formatYMD(realDate)}-${formatYMD(nextWeek)}`;
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data && data.events && data.events.length > 0) {
            const parsed = [];
            for (const ev of data.events) {
                if (ev.status.type.state === 'post') continue;
                const comp = ev.competitions[0];
                if (!comp) continue;
                const homeComp = comp.competitors.find(c => c.homeAway === 'home');
                const awayComp = comp.competitors.find(c => c.homeAway === 'away');
                if (!homeComp || !awayComp) continue;

                const getNick = t => {
                    if (!t || !t.team) return 'TBD';
                    const name = t.team.shortDisplayName || t.team.name || 'TBD';
                    if (name.toUpperCase() === 'TBD') return 'TBD';
                    const parts = name.trim().split(' ');
                    return parts[parts.length - 1];
                };
                const homeNick = getNick(homeComp);
                const awayNick = getNick(awayComp);
                if (homeNick === 'TBD' && awayNick === 'TBD') continue;

                const dateObj = new Date(ev.date);
                const timeStr = dateObj.toLocaleTimeString('en-US', {
                    timeZone: 'America/Los_Angeles', hour: 'numeric', minute: '2-digit', hour12: true
                }) + ' PT';

                // Parse ESPN odds
                let homeML = null, awayML = null;
                if (comp.odds && comp.odds.length > 0) {
                    const odds = comp.odds[0];
                    if (odds.homeTeamOdds?.moneyLine !== undefined) homeML = odds.homeTeamOdds.moneyLine;
                    if (odds.awayTeamOdds?.moneyLine !== undefined) awayML = odds.awayTeamOdds.moneyLine;
                }

                // Load votes
                await loadVotesForGame(parseInt(ev.id));

                parsed.push({
                    id: parseInt(ev.id),
                    home: homeNick, away: awayNick,
                    homeAbbr: homeComp.team.abbreviation,
                    awayAbbr: awayComp.team.abbreviation,
                    date: formatGameDate(dateObj),
                    time: timeStr,
                    dateObj,
                    odds: { homeML, awayML }
                });
            }
            if (parsed.length > 0) {
                liveScheduleData = parsed;
                renderSchedule();
                return;
            }
        }
    } catch(e) {
        console.warn('ESPN fetch failed, using fallback', e);
    }

    // Fallback data
    const today = new Date();
    const tm1 = new Date(today); tm1.setDate(today.getDate() + 1);
    const tm2 = new Date(today); tm2.setDate(today.getDate() + 2);
    liveScheduleData = [
        { id: 201, home: 'Cavaliers', away: 'Celtics', date: formatGameDate(tm1), time: '5:00 PM PT', dateObj: tm1, odds: { homeML: -180, awayML: 150 } },
        { id: 202, home: 'Thunder', away: 'Timberwolves', date: formatGameDate(tm1), time: '7:30 PM PT', dateObj: tm1, odds: { homeML: -265, awayML: 215 } },
        { id: 203, home: 'Knicks', away: 'Pacers', date: formatGameDate(tm2), time: '5:00 PM PT', dateObj: tm2, odds: { homeML: -150, awayML: 120 } },
        { id: 204, home: 'Warriors', away: 'Rockets', date: formatGameDate(tm2), time: '7:30 PM PT', dateObj: tm2, odds: { homeML: -200, awayML: 160 } }
    ];
    // Load votes for fallback games
    for (const g of liveScheduleData) await loadVotesForGame(g.id);
    renderSchedule();
}

        <div class="space-y-3">

}

// ─── WAGER HELPERS ─────────────────────────────────────────────────
window.updateWagerPreview = function(gameId, ml) {
    const input = document.getElementById(`wager-input-${gameId}`);
    const preview = document.getElementById(`wager-preview-${gameId}`);
    if (!input || !preview) return;
    const wager = parseInt(input.value) || 0;
    if (wager <= 0) { preview.innerHTML = ''; return; }
    if (wager > userPoints) { preview.innerHTML = `<span style="color:var(--red)">Not enough points</span>`; return; }
    const mult = mlToMultiplier(ml);
    const baseReturn = nextPickValue();
    const wagerReturn = Math.round(wager * mult);
    preview.innerHTML = `If correct: base <strong style="color:white">${baseReturn} pt</strong> + wager returns <strong style="color:var(--gold)">${wagerReturn} pts</strong> = <strong style="color:var(--green)">${baseReturn + wagerReturn} pts total</strong>`;
};

window.confirmWager = async function(gameId, ml) {
    const input = document.getElementById(`wager-input-${gameId}`);
    if (!input) return;
    const wager = parseInt(input.value) || 0;
    if (wager <= 0 || wager > userPoints) return;
    const pick = getUserPickForGame(gameId);
    if (!pick) return;
    pick.wagerPoints = wager;
    pick.espnML = ml;
    await saveProfile();
    renderSchedule();
    renderPicks();
    updatePointsUI();
};

window.skipWager = async function(gameId) {
    const pick = getUserPickForGame(gameId);
    if (!pick) return;
    pick.wagerPoints = 0;
    pick.skipWager = true;
    await saveProfile();
    renderSchedule();
    renderPicks();
};

// ─── HANDLE PICK CLICK ─────────────────────────────────────────────
// First click: place pick (no wager, shows wager prompt)
// Second click on same team: removes pick
// Clicking different team: switches pick
window.handlePickClick = async function(gameId, side, team, ml) {
    if (userName === 'Guest') { showProfileModal(); return; }
    const existing = getUserPickForGame(gameId);

    if (existing) {
        if (existing.side === side) {
            // Second click same team → remove
            await cancelPick(gameId);
        } else {
            // Clicked other team → switch pick
            await placePick(gameId, side, team, 0, ml);
        }
    } else {
        // First pick
        await placePick(gameId, side, team, 0, ml);
    }
};

            const won = p.result === 'win';
            return `
            <div class="rounded-xl p-3 flex justify-between items-center border-l-2" style="background:var(--surface);border-color:${won ? 'var(--green)' : 'var(--red)'}">
                <div>
                    <div class="font-black text-sm text-white" style="font-family:'Barlow Condensed',sans-serif">
                        ${won ? '✓' : '✗'} <span class="tc-${tc}">${p.team}</span>
                    </div>
                    <div class="text-xs mt-0.5" style="color:var(--muted)">${formatShortDate(p.settledAt)}</div>
                </div>
                <div class="text-right">
                    <div class="font-black text-sm" style="font-family:'Barlow Condensed',sans-serif;color:${won ? 'var(--green)' : 'var(--red)'}">
                        ${p.pointsEarned >= 0 ? '+' : ''}${p.pointsEarned} pts
                    </div>
                    ${p.wagerPoints > 0 ? `<div class="text-xs" style="color:var(--muted)">${p.wagerPoints} wagered</div>` : ''}
                </div>
            </div>`;
        }).join('');
    }

    // Points chart
    renderPointsChart();

    // Streak & stats
    document.getElementById('streak-display').textContent = currentStreak;
    document.getElementById('next-pts-display').textContent = `${nextPickValue()} pt${nextPickValue() > 1 ? 's' : ''}`;
    document.getElementById('record-display').textContent = `${totalCorrect} / ${totalPicks}`;
    document.getElementById('chart-pts-label').textContent = userPoints;

    // Streak banner
    const banner = document.getElementById('streak-banner');
    if (currentStreak >= 2) {
        banner.classList.remove('hidden');
        document.getElementById('streak-banner-text').textContent = `🔥 ${currentStreak}-PICK STREAK — NEXT CORRECT WORTH ${nextPickValue()} PTS`;
    } else {
        banner.classList.add('hidden');
    }
}

function renderPointsChart() {
    const wrapper = document.getElementById('points-chart-wrapper');
    if (!wrapper) return;
    const w = wrapper.clientWidth || 400;
    const h = 140;
    const padX = 40, padY = 20;

    let pts = pointsHistory.length > 0 ? pointsHistory : [{ time: Date.now(), val: 0 }];
    if (pts.length === 1) pts = [{ time: pts[0].time - 86400000, val: 0 }, pts[0]];

    const maxVal = Math.max(...pts.map(p => p.val), 10) * 1.15;
    const points = pts.map((p, i) => ({
        x: padX + (i / (pts.length - 1)) * (w - padX - 10),
        y: h - padY - ((p.val / maxVal) * (h - 2 * padY)),
        val: p.val
    }));
    const poly = points.map(p => `${p.x},${p.y}`).join(' ');

    let svg = `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}">`;
    // Grid lines
    for (let i = 0; i <= 3; i++) {
        const yVal = (maxVal / 3) * i;
        const yPos = h - padY - ((yVal / maxVal) * (h - 2 * padY));
        svg += `<line x1="${padX}" y1="${yPos}" x2="${w - 5}" y2="${yPos}" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3"/>`;
        svg += `<text x="4" y="${yPos + 4}" fill="#5a7090" font-size="9" font-weight="700" font-family="Barlow Condensed">${Math.round(yVal)}</text>`;
    }
    // Area fill
    svg += `<path d="M ${points[0].x},${h - padY} ${poly} ${points[points.length-1].x},${h - padY} Z" fill="rgba(245,158,11,0.08)"/>`;
    // Line
    svg += `<polyline fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${poly}"/>`;
    // Dots
    points.forEach(p => {
        svg += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#f59e0b" stroke="var(--bg)" stroke-width="2"/>`;
    });
    svg += `</svg>`;
    wrapper.innerHTML = svg;
}

// ─── LEADERBOARD ───────────────────────────────────────────────────
async function fetchLeaderboard() {
    const list = document.getElementById('leaderboard-list');
    list.innerHTML = `<div class="p-8 text-center"><div class="spin w-6 h-6 rounded-full border-2 mx-auto" style="border-color:var(--accent);border-top-color:transparent"></div></div>`;
    try {
        const data = await dbGet('/users');
        leaderboardData = data ? Object.values(data) : [];
        leaderboardData.sort((a, b) => (parseFloat(b.points) || 0) - (parseFloat(a.points) || 0));

        if (leaderboardData.length === 0) {
            list.innerHTML = `<div class="p-8 text-center text-sm italic" style="color:var(--muted)">No players yet. Be the first!</div>`;
            return;
        }

        list.innerHTML = leaderboardData.map((user, idx) => {
            const pts = parseFloat(user.points) || 0;
            const tc = parseInt(user.totalCorrect) || 0;
            const tp = parseInt(user.totalPicks) || 0;
            const streak = parseInt(user.currentStreak) || 0;
            const isMe = user.name === userName;
            const medals = ['🥇','🥈','🥉'];
            return `
            <div onclick="showUserDetail('${user.name}')" class="grid grid-cols-12 px-4 py-3 items-center cursor-pointer transition-colors hover:opacity-80" style="${isMe ? 'background:rgba(37,99,235,0.08)' : ''}">
                <div class="col-span-1 font-black text-xs" style="font-family:'Barlow Condensed',sans-serif;color:var(--muted)">${idx < 3 ? medals[idx] : idx + 1}</div>
                <div class="col-span-7 flex items-center gap-2">
                    <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-black text-white" style="background:${isMe ? 'var(--accent)' : 'var(--surface2)'}">${(user.name || '?').charAt(0).toUpperCase()}</div>
                    <div>
                        <div class="font-bold text-sm ${isMe ? 'text-blue-400' : 'text-white'}">${user.name}</div>
                        ${streak >= 2 ? `<div class="text-xs" style="color:var(--gold)">🔥 ${streak} streak</div>` : ''}
                    </div>
                </div>
                <div class="col-span-2 text-center text-xs font-semibold" style="color:var(--muted)">${tc}/${tp}</div>
                <div class="col-span-2 text-right font-black text-sm" style="font-family:'Barlow Condensed',sans-serif;color:var(--gold)">${Math.round(pts)}</div>
            </div>`;
        }).join('');
    } catch(e) {
        list.innerHTML = `<div class="p-8 text-center text-sm" style="color:var(--muted)">Error loading standings.</div>`;
    }
}

function showUserDetail(name) {
    const user = leaderboardData.find(u => u.name === name);
    if (!user) return;

    let pHistory = [{ time: Date.now(), val: 0 }];
    try { pHistory = JSON.parse(user.pointsHistory) || pHistory; } catch(e) {}
    let pHist = [];
    try { pHist = JSON.parse(user.pickHistory) || []; } catch(e) {}

    const modal = document.getElementById('custom-modal');
    const content = document.getElementById('modal-content');
    const actions = document.getElementById('modal-actions');
    const closeIcon = document.getElementById('modal-close-icon');

    closeIcon.classList.remove('hidden');
    actions.classList.add('hidden');

    content.innerHTML = `
        <div class="space-y-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full flex items-center justify-center text-xl font-black text-white" style="background:var(--accent)">${(user.name || '?').charAt(0).toUpperCase()}</div>
                <div>
                    <div class="font-black text-xl text-white" style="font-family:'Barlow Condensed',sans-serif">${user.name}</div>
                    <div class="font-black text-base" style="color:var(--gold)">${Math.round(parseFloat(user.points) || 0)} pts</div>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <div class="rounded-xl p-3 text-center" style="background:var(--surface2)">
                    <div class="font-black text-lg text-white" style="font-family:'Barlow Condensed',sans-serif">${user.totalCorrect || 0}</div>
                    <div class="text-xs" style="color:var(--muted)">Correct</div>
                </div>
                <div class="rounded-xl p-3 text-center" style="background:var(--surface2)">
                    <div class="font-black text-lg text-white" style="font-family:'Barlow Condensed',sans-serif">${user.totalPicks || 0}</div>
                    <div class="text-xs" style="color:var(--muted)">Total</div>
                </div>
                <div class="rounded-xl p-3 text-center" style="background:var(--surface2)">
                    <div class="font-black text-lg" style="font-family:'Barlow Condensed',sans-serif;color:var(--gold)">${user.currentStreak || 0}</div>
                    <div class="text-xs" style="color:var(--muted)">Streak</div>
                </div>
            </div>
            <div>
                <div class="text-xs font-black uppercase tracking-wider mb-2" style="color:var(--muted)">Recent Picks</div>
                <div class="space-y-1 max-h-40 overflow-y-auto">
                    ${pHist.slice(0, 8).map(p => `
                    <div class="flex justify-between items-center text-xs py-1 border-b" style="border-color:var(--border)">
                        <span class="${p.result === 'win' ? 'text-green-400' : 'text-red-400'} font-bold">${p.result === 'win' ? '✓' : '✗'} ${p.team}</span>
                        <span style="color:var(--gold);font-weight:700">${p.pointsEarned >= 0 ? '+' : ''}${p.pointsEarned} pts</span>
                    </div>`).join('') || `<div class="text-xs italic" style="color:var(--muted)">No history yet</div>`}
                </div>
            </div>
        </div>`;
    modal.classList.remove('hidden');
}

// ─── RESULTS TAB ───────────────────────────────────────────────────
function renderResults() {
    const list = document.getElementById('results-list');
    const results = [
        { date: 'Friday, May 16', away: 'Cavaliers', home: 'Celtics', score: [94, 115] },
        { date: 'Friday, May 16', away: 'Thunder', home: 'Timberwolves', score: [112, 109] },
        { date: 'Thursday, May 15', away: 'Knicks', home: 'Pacers', score: [105, 98] },
        { date: 'Wednesday, May 14', away: 'Warriors', home: 'Rockets', score: [101, 113] },
        { date: 'Tuesday, May 13', away: 'Celtics', home: 'Cavaliers', score: [97, 108] }
    ];

    const groups = {};
    results.forEach(r => {
        if (!groups[r.date]) groups[r.date] = [];
        groups[r.date].push(r);
    });

    let html = '';
    for (const date in groups) {
        html += `<div class="space-y-2">
            <div class="text-xs font-black uppercase tracking-widest py-1 border-b" style="color:var(--muted);border-color:var(--border)">${date}</div>`;
        groups[date].forEach(r => {
            const awayWon = r.score[0] > r.score[1];
            const homeWon = !awayWon;
            const awayTc = teamClass(r.away);
            const homeTc = teamClass(r.home);
            html += `
            <div class="rounded-xl p-4 flex justify-between items-center" style="background:var(--surface);border:1px solid var(--border)">
                <div class="font-black text-base" style="font-family:'Barlow Condensed',sans-serif">
                    <span class="${awayWon ? `tc-${awayTc} text-white` : ''}" style="${!awayWon ? 'color:var(--muted)' : ''}">${r.away}</span>
                    <span style="color:var(--border-bright)"> @ </span>
                    <span class="${homeWon ? `tc-${homeTc} text-white` : ''}" style="${!homeWon ? 'color:var(--muted)' : ''}">${r.home}</span>
                </div>
                <div class="font-black text-xl" style="font-family:'Barlow Condensed',sans-serif">
                    <span class="${awayWon ? 'text-white' : ''}" style="${!awayWon ? 'color:var(--muted)' : ''}">${r.score[0]}</span>
                    <span style="color:var(--border-bright)">–</span>
                    <span class="${homeWon ? 'text-white' : ''}" style="${!homeWon ? 'color:var(--muted)' : ''}">${r.score[1]}</span>
                </div>
            </div>`;
        });
        html += `</div>`;
    }
    list.innerHTML = html;
}

// ─── UI HELPERS ────────────────────────────────────────────────────
function updatePointsUI() {
    document.getElementById('user-points-display').textContent = userPoints;
    if (document.getElementById('section-picks').classList.contains('active')) {
        renderPicks();
    }
}

function switchTab(id) {
    document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
    document.getElementById('section-' + id).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + id).classList.add('active');
    if (id === 'picks') { renderPicks(); }
    if (id === 'leaderboard') { fetchLeaderboard(); }
    if (id === 'results') { renderResults(); }
}
window.switchTab = switchTab;

// ─── PROFILE MODAL ─────────────────────────────────────────────────
window.showProfileModal = function() {
    const modal = document.getElementById('custom-modal');
    const content = document.getElementById('modal-content');
    const actions = document.getElementById('modal-actions');
    const closeIcon = document.getElementById('modal-close-icon');
    closeIcon.classList.add('hidden');
    actions.classList.remove('hidden');
    actions.innerHTML = `
        <button onclick="closeModal()" class="flex-1 py-3 rounded-xl font-bold text-xs uppercase tracking-widest" style="background:var(--surface2);color:var(--muted)">Cancel</button>
        <button id="modal-confirm-btn" class="flex-1 py-3 rounded-xl font-bold text-xs uppercase tracking-widest text-white" style="background:var(--accent)">Sign In</button>`;
    content.innerHTML = `
        <h3 class="font-black text-xl text-white mb-1 text-center" style="font-family:'Barlow Condensed',sans-serif;letter-spacing:0.03em">JOIN THE PICKS</h3>
        <p class="text-xs text-center mb-4" style="color:var(--muted)">Enter a username to track picks & compete</p>
        <input type="text" id="name-input" placeholder="Your username" maxlength="20"
            class="w-full rounded-xl px-4 py-3 text-sm font-semibold text-white outline-none"
            style="background:var(--surface2);border:1px solid var(--border-bright)"
            value="${userName === 'Guest' ? '' : userName}">`;
    document.getElementById('modal-confirm-btn').onclick = async () => {
        const n = document.getElementById('name-input').value.trim();
        if (!n) return;
        closeModal();
        showOverlay('Loading profile...');
        userName = n;
        localStorage.setItem('theo_user_name', n);
        await loadProfile(n);
        updateUserNameUI();
        updatePointsUI();
        renderSchedule();
        renderPicks();
        hideOverlay();
        document.getElementById('delete-profile-btn').classList.remove('hidden');
    };
    modal.classList.remove('hidden');
    setTimeout(() => document.getElementById('name-input')?.focus(), 50);
};

window.showDeleteModal = function() {
    const modal = document.getElementById('custom-modal');
    const content = document.getElementById('modal-content');
    const actions = document.getElementById('modal-actions');
    const closeIcon = document.getElementById('modal-close-icon');
    closeIcon.classList.add('hidden');
    actions.classList.remove('hidden');
    actions.innerHTML = `
        <button onclick="closeModal()" class="flex-1 py-3 rounded-xl font-bold text-xs uppercase tracking-widest" style="background:var(--surface2);color:white">Cancel</button>
        <button id="modal-confirm-btn" class="flex-1 py-3 rounded-xl font-bold text-xs uppercase tracking-widest text-white" style="background:var(--red)">Delete</button>`;
    content.innerHTML = `
        <h3 class="font-black text-xl text-red-400 text-center mb-2" style="font-family:'Barlow Condensed',sans-serif">DELETE PROFILE?</h3>
        <p class="text-xs text-center" style="color:var(--muted)">This will erase "${userName}" and all pick history.</p>`;
    document.getElementById('modal-confirm-btn').onclick = async () => {
        closeModal();
        await dbDelete(`/users/${encodeURIComponent(userName)}`);
        localStorage.removeItem('theo_user_name');
        location.reload();
    };
    modal.classList.remove('hidden');
};

window.closeModal = () => {
    document.getElementById('custom-modal').classList.add('hidden');
};

function updateUserNameUI() {
    document.getElementById('user-name-display').textContent = userName;
    const del = document.getElementById('delete-profile-btn');
    if (userName !== 'Guest') del.classList.remove('hidden');
    else del.classList.add('hidden');
}

function showOverlay(m) {
    document.getElementById('sync-overlay').classList.remove('hidden');
    document.getElementById('sync-message').textContent = m;
}
function hideOverlay() {
    document.getElementById('sync-overlay').classList.add('hidden');
}

// ─── INIT ──────────────────────────────────────────────────────────
async function init() {
    document.getElementById('header-date').textContent = formatGameDate(new Date(), true) + ' · NBA Pick 'Em';
    updateUserNameUI();

    if (userName !== 'Guest') {
        showOverlay('Syncing profile...');
        await loadProfile(userName);
        hideOverlay();
    } else {
        resetUserState();
    }

    updatePointsUI();
    await fetchGameData();
}

window.onload = init;
</script>
